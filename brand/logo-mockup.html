<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#f2ebdf;font-family:Archivo,sans-serif}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px;width:1152px}
  .tile{display:grid;place-items:center;height:520px;border:2px solid #171211}
  .paper{background:#f2ebdf}.ink{background:#171211;--gap:#171211}.red{background:#d7261e}
  .lock{display:flex;align-items:center;gap:22px}
  .word{font-weight:900;font-stretch:62.5%;text-transform:uppercase;line-height:.82;font-size:118px;color:#171211}
  .tag{display:block;font:800 22px/1 Archivo;font-stretch:125%;letter-spacing:.18em;color:#2e7d32;margin-top:14px}
  .ink .word{color:#f2ebdf}.ink .tag{color:#7fc47f}
  .icons{display:flex;gap:28px;align-items:end}
  .app{display:grid;place-items:center;border-radius:22%}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- one chilli, lying horizontally: stem end at x=0, tip at x≈200 -->
    <symbol id="chilli-red" viewBox="-30 -30 240 70" overflow="visible">
      <path d="M18,-4 C72,-26 150,-20 203,12 C150,9 73,24 18,25 C5,25 -2,16 0,10 C2,2 9,-3 18,-4Z" fill="#d7261e" style="stroke:var(--gap,#f2ebdf);stroke-width:7;paint-order:stroke;stroke-linejoin:round"/>
      <path d="M42,-2 C84,-13 131,-11 171,2" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>
      <path d="M25,-8 C14,-15 1,-10 -3,4 C1,17 14,27 25,29 C19,16 19,5 25,-8Z" fill="#2e7d32"/>
      <path d="M0,8 C-12,6 -22,-2 -26,-16" fill="none" stroke="#2e7d32" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="chilli-green" viewBox="-30 -30 240 70" overflow="visible">
      <path d="M18,-4 C72,-26 150,-20 203,12 C150,9 73,24 18,25 C5,25 -2,16 0,10 C2,2 9,-3 18,-4Z" fill="#2e7d32" style="stroke:var(--gap,#f2ebdf);stroke-width:7;paint-order:stroke;stroke-linejoin:round"/>
      <path d="M42,-2 C84,-13 131,-11 171,2" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>
      <path d="M25,-8 C14,-15 1,-10 -3,4 C1,17 14,27 25,29 C19,16 19,5 25,-8Z" fill="#1b5e20"/>
      <path d="M0,8 C-12,6 -22,-2 -26,-16" fill="none" stroke="#1b5e20" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <!-- the "4": diagonal, upper stem, crossbar, lower stem — four chillies -->
    <symbol id="four" viewBox="-10 -24 350 470">
      <g transform="translate(190,30) rotate(127.6) scale(1.24)"><use href="#chilli-red" width="240" height="70" x="-30" y="-30"/></g>
      <g transform="translate(262,236) rotate(180) scale(1.1)"><use href="#chilli-red" width="240" height="70" x="-30" y="-30"/></g>
      <g transform="translate(206,24) rotate(90) scale(.95)"><use href="#chilli-green" width="240" height="70" x="-30" y="-30"/></g>
      <g transform="translate(184,420) rotate(-90) scale(.82)"><use href="#chilli-green" width="240" height="70" x="-30" y="-30"/></g>
    </symbol>
  </defs>
</svg>
<div class="board">
  <div class="tile paper"><div class="lock"><svg width="200" height="269"><use href="#four"/></svg>
    <div><div class="word">Chilli</div><span class="tag">DURBAN STYLE</span></div></div></div>
  <div class="tile ink"><div class="lock"><svg width="200" height="269"><use href="#four"/></svg>
    <div><div class="word">Chilli</div><span class="tag">DURBAN STYLE</span></div></div></div>
  <div class="tile paper"><svg width="340" height="457"><use href="#four"/></svg></div>
  <div class="tile paper"><div class="icons">
    <div class="app red" style="width:200px;height:200px"><div class="app" style="width:150px;height:150px;background:#f2ebdf;border-radius:50%"><svg width="100" height="134"><use href="#four"/></svg></div></div>
    <div class="app" style="width:96px;height:96px;background:#f2ebdf;border:2px solid #171211"><svg width="62" height="83"><use href="#four"/></svg></div>
    <div class="app" style="width:48px;height:48px;background:#f2ebdf;border:2px solid #171211"><svg width="30" height="40"><use href="#four"/></svg></div>
  </div></div>
</div></body></html>
